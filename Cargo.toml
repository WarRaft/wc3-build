[package]
name = "wc3-build"
version = "0.1.0"
edition = "2024"
description = "Builds a Warcraft III map's script: one model of the code (the IR) from every source, and the game's JASS (later AngelScript and Lua) from it"
license = "CC0-1.0"

[lib]
name = "wc3_build"
path = "src/lib.rs"

[dependencies]
jass-rs = { path = "../jass-rs" }
zinc-rs = { path = "../zinc-rs" }
parser-rs = { path = "../parser-rs" }
w3i-rs = { path = "../w3i-rs" }
w3r-rs = { path = "../w3r-rs" }
w3c-rs = { path = "../w3c-rs" }
w3s-rs = { path = "../w3s-rs" }
slk-rs = { path = "../slk-rs" }
wtg-rs = { path = "../wtg-rs" }
doo-rs = { path = "../doo-rs" }
w3abdhqtu-rs = { path = "../w3abdhqtu-rs" }
